<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160" fill="none">
  <circle id="dot-1" cx="96" cy="84" r="11" fill="#6366F1"/>
  <circle id="dot-2" cx="120" cy="84" r="11" fill="#818CF8"/>
  <circle id="dot-3" cx="144" cy="84" r="11" fill="#A5B4FC"/>
<style>@keyframes m-dot-1-0-transform {
  0% { animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); transform: translateY(0px); }
  22% { animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45); transform: translateY(-18px); }
  44% { transform: translateY(-8.851289692302089e-7px); }
  100% { transform: translateY(0px); }
}
@keyframes m-dot-1-0-opacity {
  0% { opacity: 1; }
  22% { opacity: 0.65; }
  44% { opacity: 1; }
  100% { opacity: 1; }
}
@keyframes m-dot-2-1-transform {
  0% { transform: translateY(0px); }
  12% { animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); transform: translateY(0px); }
  34% { animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45); transform: translateY(-18px); }
  56% { transform: translateY(-8.851289692302089e-7px); }
  100% { transform: translateY(0px); }
}
@keyframes m-dot-3-2-transform {
  0% { transform: translateY(0px); }
  24% { animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); transform: translateY(0px); }
  46% { animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45); transform: translateY(-18px); }
  68% { transform: translateY(-8.851289692302089e-7px); }
  100% { transform: translateY(0px); }
}
@keyframes m-dot-3-2-opacity {
  0% { opacity: 0.5; }
  46% { opacity: 0.8; }
  68% { opacity: 0.5; }
  100% { opacity: 0.5; }
}
#dot-1 { animation: m-dot-1-0-transform 1200ms linear infinite both, m-dot-1-0-opacity 1200ms linear infinite both; transform-box: fill-box; transform-origin: center; }
#dot-2 { animation: m-dot-2-1-transform 1200ms linear infinite both; transform-box: fill-box; transform-origin: center; }
#dot-3 { animation: m-dot-3-2-transform 1200ms linear infinite both, m-dot-3-2-opacity 1200ms linear infinite both; transform-box: fill-box; transform-origin: center; }
@media (prefers-reduced-motion: reduce) {
#dot-1 { animation: none; transform: translateY(0px); transform-box: fill-box; opacity: 1; }
#dot-2 { animation: none; transform: translateY(0px); transform-box: fill-box; }
