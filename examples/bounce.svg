<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160" fill="none">
  <ellipse id="bounce-shadow" cx="120" cy="134" rx="34" ry="7" fill="#0F172A" opacity="0.12"/>
  <circle id="bounce-ball" cx="120" cy="48" r="22" fill="#F59E0B"/>
<style>@keyframes m-bounce-ball-0-transform {
  0% { animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45); transform: translateY(0px) scaleX(1) scaleY(1); }
  40% { animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45); transform: translateY(27.833624259343445px) scaleX(0.97) scaleY(1.04); }
  48% { animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); transform: translateY(61.999996951222435px) scaleX(1.1999999886900188) scaleY(0.7800000127851963); }
  58% { animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); transform: translateY(21.23245811453811px) scaleX(0.99) scaleY(1.02); }
  70% { transform: translateY(4.333911480905876px) scaleX(1) scaleY(1); }
  100% { transform: translateY(0px) scaleX(1) scaleY(1); }
}
@keyframes m-bounce-ball-0-origin {
  0% { transform-origin: 50% 100%; }
  100% { transform-origin: 50% 100%; }
}
@keyframes m-bounce-shadow-1-transform {
  0% { animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45); transform: scaleX(0.78); }
  48% { animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); transform: scaleX(0.999999989181757); }
  100% { transform: scaleX(0.78); }
}
@keyframes m-bounce-shadow-1-opacity {
  0% { animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45); opacity: 0.12; }
  48% { animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); opacity: 0.22; }
  100% { opacity: 0.12; }
}
#bounce-ball { animation: m-bounce-ball-0-transform 1400ms linear infinite both, m-bounce-ball-0-origin 1400ms linear infinite both; transform-box: fill-box; }
#bounce-shadow { animation: m-bounce-shadow-1-transform 1400ms linear infinite both, m-bounce-shadow-1-opacity 1400ms linear infinite both; transform-box: fill-box; transform-origin: center; }
@media (prefers-reduced-motion: reduce) {
#bounce-ball { animation: none; transform: translateY(0px) scaleX(1) scaleY(1); transform-box: fill-box; transform-origin: 50% 100%; }
#bounce-shadow { animation: none; transform: scaleX(0.78); transform-box: fill-box; opacity: 0.12; }
}</style></svg>