}
#heart-body { animation: m-heart-body-0-transform 1600ms linear infinite both, m-heart-body-0-filter 1600ms linear infinite both; transform-box: fill-box; transform-origin: center; }
@media (prefers-reduced-motion: reduce) {
#heart-body { animation: none; transform: scale(1); transform-box: fill-box; filter: brightness(100%); }
