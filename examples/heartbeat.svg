<style>@keyframes m-heart-body-0-transform {
  0% { transform: scale(1); }
  10% { animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); transform: scale(1.12); }
  20% { animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); transform: scale(1); }
  28% { animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); transform: scale(1.0699999999999998); }
  40% { animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); transform: scale(1); }
  100% { transform: scale(1); }
}
@keyframes m-heart-body-0-filter {
  0% { filter: brightness(100%); }
  10% { filter: brightness(122%); }
  40% { filter: brightness(100%); }
