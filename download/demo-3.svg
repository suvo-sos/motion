<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none"><title>Countdown</title><rect x="0" y="0" width="240" height="240" fill="#ffffff" /><circle id="e0" cx="120" cy="120" r="92" stroke="#E2E8F0" stroke-width="6" opacity="0.7"/><circle id="e1" cx="120" cy="120" r="92" stroke="#F43F5E" stroke-width="6" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" transform="rotate(-90 120 120)"/><g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="96" font-weight="700" text-anchor="middle" dominant-baseline="central" id="e2"><text id="e3" x="120" y="120" fill="#F43F5E" opacity="0">5</text><text id="e4" x="120" y="120" fill="#F59E0B" opacity="0">4</text><text id="e5" x="120" y="120" fill="#22C55E" opacity="0">3</text><text id="e6" x="120" y="120" fill="#0EA5E9" opacity="0">2</text><text id="e7" x="120" y="120" fill="#8B5CF6" opacity="0">1</text></g><style>@keyframes m-countdown-ring-0-strokeDashoffset { 0% { animation-timing-function: linear; stroke-dashoffset: 1; } 100% { stroke-dashoffset: 0; } } @keyframes m-countdown-ring-0-stroke { 0% { animation-timing-function: linear; stroke: #F43F5E; } 19.9% { animation-timing-function: linear; stroke: #F43F5E; } 20% { animation-timing-function: linear; stroke: #F59E0B; } 39.9% { animation-timing-function: linear; stroke: #F59E0B; } 40% { animation-timing-function: linear; stroke: #22C55E; } 59.9% { animation-timing-function: linear; stroke: #22C55E; } 60% { animation-timing-function: linear; stroke: #0EA5E9; } 79.9% { animation-timing-function: linear; stroke: #0EA5E9; } 80% { animation-timing-function: linear; stroke: #8B5CF6; } 100% { stroke: #8B5CF6; } } @keyframes m-count-5-1-transform { 0% { animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); transform: scale(0.8); } 4.5% { animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); transform: scale(1.08); } 9% { animation-timing-function: cubic-bezier(0.65, 0, 0.35,